name: watch
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may start it a few minutes late; healthchecks grace covers that
  workflow_dispatch:
concurrency: { group: watch, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 salus_watch.py
        env:
          SALUS_USER: ${{ secrets.SALUS_USER }}
          SALUS_PASS_MD5: ${{ secrets.SALUS_PASS_MD5 }}
          SALUS_DEVID: ${{ secrets.SALUS_DEVID }}
          HC_URL: ${{ secrets.HC_URL }}
